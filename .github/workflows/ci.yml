name: CI

# Every push and pull request: types, lint, unit tests with coverage, the build and the browser
# tests. On main, the site goes live once all of them pass (pages.yml).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request stops the run for the commit before.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Codecov checks who uploads with GitHub's OIDC token, so no upload token is needed.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Fails below 95 % (vite.config.ts).
      - run: pnpm test:coverage
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage/lcov.info
          flags: unit
          disable_search: true
          # A failed upload (e.g. Codecov does not know the repository) fails the run instead of
          # only showing up in the log.
          fail_ci_if_error: true
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Only main goes live, and only after every check has passed. A newer run cancels a deploy
  # still in progress.
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
